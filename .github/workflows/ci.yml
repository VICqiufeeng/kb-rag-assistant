name: CI

on:
  push:
  pull_request:

# 单测只覆盖「不需要 GPU / 不需要 MySQL / 不需要语料」的那一层：
# jieba、sentence-transformers、transformers、PyMySQL 都是函数内延迟导入，
# 数据库与索引在测试里被 dependency_overrides 换成临时 sqlite 与桩，
# 所以这里只装 `.[dev]`（核心依赖 + pytest + httpx2）就能跑完 28 项。
# 语料与向量索引在 .gitignore 里，clone 后为空属预期，见 README「从零复现」。

jobs:
  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.8 check src scripts tests web

  test:
    name: 单测（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装（不含 torch / 不含 GPU 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 语法自检（scripts 不被单测导入，这里补上）
        run: python -m compileall -q src scripts tests
      - name: pytest
        run: python -m pytest -q
